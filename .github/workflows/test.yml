name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: IceAsteroid/disbuf-pivot
          path: disbuf-pivot

      - uses: jcs090218/setup-emacs@master
        with:
          version: '31.1'

      - name: Install Eldev
        run: curl -fsSL https://raw.github.com/emacs-eldev/eldev/master/webinstall/github-eldev | sh

      - name: Install dependencies
        run: |
          emacs -Q --batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'ace-window) (package-install 'avy) (package-install 'consult))"

      - name: Check
        run: make check DISPLAY_PACKAGE=disbuf-pivot

      - name: Checkdoc
        run: make checkdoc DISPLAY_PACKAGE=disbuf-pivot
